<!DOCTYPE html>
<html>

<head>
    <title>👻 CHROMA-GHOST SmartBoard Prototype</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        #qr-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        canvas {
            border: 2px solid #333;
            border-radius: 5px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #222;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 350px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #0088ff, #0055ff);
            color: white;
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .status {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type=range] {
            flex-grow: 1;
            margin-left: 15px;
            cursor: pointer;
        }

        .label {
            font-size: 14px;
            color: #ccc;
        }

        .freq-display {
            font-family: monospace;
            font-size: 18px;
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="status">CHROMA-GHOST: Physical Liveness Seal</div>
    <div id="qr-container">
        <canvas id="ghostCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="control-row">
            <button onclick="toggleGhost()" id="ghostBtn">GHOST MODE: ON</button>
            <span id="modeStatus" class="label" style="display:none;">Vibrating</span>
        </div>

        <div class="control-row">
            <span class="label">Frequency:</span>
            <input type="range" id="freqSlider" min="5" max="60" value="30" oninput="updateFreq(this.value)">
            <span class="freq-display" id="freqVal">30Hz</span>
        </div>
        <div style="font-size: 11px; color: #777; text-align: center;">Note: Frequencies > (Refresh Rate / 2) will
            alias.</div>
    </div>

    <script>
        const canvas = document.getElementById('ghostCanvas');
        const ctx = canvas.getContext('2d');
        const size = 400;
        const grid = 20;
        let isGhostMode = true;
        let frequency = 30; // Hz

        const ColorA = "rgb(25, 0, 0)";
        const ColorB = "rgb(0, 0, 60)";

        function updateFreq(val) {
            frequency = parseInt(val);
            document.getElementById('freqVal').innerText = frequency + "Hz";
        }

        function draw(time) {
            ctx.clearRect(0, 0, size, size);
            const cellSize = size / grid;

            // Calculate color state based on time and frequency
            // One full cycle = 1000 / frequency ms
            // Half cycle = 500 / frequency ms
            const cycleTime = 1000 / frequency;
            const isPhaseA = (time % cycleTime) < (cycleTime / 2);

            for (let x = 0; x < grid; x++) {
                for (let y = 0; y < grid; y++) {
                    const isModule = (Math.sin(x * y + x + y) > 0);

                    if (isModule) {
                        if (isGhostMode) {
                            ctx.fillStyle = isPhaseA ? ColorA : ColorB;
                        } else {
                            ctx.fillStyle = "black";
                        }
                    } else {
                        ctx.fillStyle = "white";
                    }
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }

            requestAnimationFrame(draw);
        }

        function toggleGhost() {
            isGhostMode = !isGhostMode;
            const btn = document.getElementById('ghostBtn');
            btn.innerText = "GHOST MODE: " + (isGhostMode ? "ON" : "OFF");
            btn.style.background = isGhostMode ? "linear-gradient(135deg, #0088ff, #0055ff)" : "#444";
        }

        requestAnimationFrame(draw);
    </script>
</body>

</html>
