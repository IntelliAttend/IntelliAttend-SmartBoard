<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Layout Preview</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }

  .resize-handle {
    resize: both; overflow: auto;
    width: 1366px; height: 768px;
    min-width: 800px; min-height: 600px;
    max-width: 1920px; max-height: 1200px;
    border: 2px dashed #666;
    margin: 20px auto;
    position: relative;
  }

  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #f8fafc;
  }

  /* Header */
  .header {
    height: 72px; flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 32px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }
  .header .logo { font-size: 24px; font-weight: 900; color: #0d9488; letter-spacing: -1.5px; }
  .header .divider { width: 1px; height: 24px; background: #e2e8f0; margin: 0 24px; }
  .header .course-info { flex: 1; }
  .header .course-name { font-size: 14px; font-weight: bold; }
  .header .meta { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* Body row */
  .body-row {
    flex: 1; display: flex; overflow: hidden;
  }

  /* Seating grid - left */
  .seating {
    flex: 4; padding: 32px;
    border-right: 1px solid #e2e8f0;
    background: rgba(255,255,255,0.5);
    display: flex; flex-direction: column;
  }
  .seating .grid {
    flex: 1; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 12px; align-content: start;
    overflow-y: auto;
  }
  .seat { aspect-ratio: 1; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #94a3b8; }
  .seat.present { background: #f1f9e6; border-color: #84cc16; color: #1a2e05; }
  .seating .legend { margin-top: 24px; display: flex; gap: 32px; justify-content: center; padding: 12px 24px; background: #fff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.05); font-size: 11px; font-weight: bold; letter-spacing: 1.5px; color: #64748b; }
  .legend-dot { display: inline-block; width: 16px; height: 16px; border-radius: 4px; vertical-align: middle; margin-right: 8px; }

  /* QR Arena - right */
  .qr-arena {
    flex: 6; padding: 24px;
    display: flex; flex-direction: column;
    align-items: center;
  }

  .badge {
    flex-shrink: 0;
    padding: 6px 16px; border-radius: 100px;
    background: rgba(132, 204, 22, 0.1);
    border: 1px solid rgba(132, 204, 22, 0.3);
    font-size: 12px; font-weight: bold; color: #84cc16;
    letter-spacing: 1px;
  }
  .badge-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #84cc16; vertical-align: middle; margin-right: 10px; }

  /* QR container — greedy */
  .qr-container {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; margin: 16px 0;
    background: #fff;
    border: 6px solid rgba(132, 204, 22, 0.3);
    border-radius: 32px;
    box-shadow: 0 0 40px rgba(132, 204, 22, 0.1);
    min-height: 0;
  }
  .qr-inner {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-inner canvas, .qr-inner img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }

  /* Timer — bottom */
  .timer-area {
    flex-shrink: 0; text-align: center;
  }
  .timer-label { font-size: 10px; font-weight: bold; color: #94a3b8; letter-spacing: 3px; }
  .timer-value {
    font-size: 48px; font-weight: bold; font-family: 'Courier New', monospace;
    white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }

  /* Footer */
  .footer {
    height: 72px; flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 32px;
    background: #fff;
    border-top: 1px solid #e2e8f0;
  }
  .footer .label { font-size: 10px; color: #94a3b8; letter-spacing: 2px; }
  .footer .count { font-size: 24px; font-weight: bold; }
  .footer .total { font-size: 16px; color: #94a3b8; }

  /* Controls */
  .controls {
    text-align: center; margin-top: 10px;
    font-size: 14px; color: #64748b;
  }
  .controls button {
    padding: 6px 16px; margin: 0 4px; cursor: pointer;
    border: 1px solid #cbd5e1; border-radius: 6px;
    background: #fff; font-size: 13px;
  }
  .controls button:hover { background: #f1f5f9; }
  .controls input { width: 60px; text-align: center; }
  .size-label { font-weight: bold; color: #0d9488; margin-left: 12px; }
</style>
</head>
<body>

<div style="text-align:center;padding:10px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;">
  <strong>Resize from corners</strong>
  <span class="size-label" id="sizeLabel">1366 × 768</span>
</div>

<div class="controls">
  Preset:
  <button onclick="setSize(1920,1080)">1080p (1920×1080)</button>
  <button onclick="setSize(1366,768)">HD (1366×768)</button>
  <button onclick="setSize(1280,720)">720p (1280×720)</button>
  <button onclick="setSize(1024,768)">XGA (1024×768)</button>
  <button onclick="setSize(3840,2160)">4K (3840×2160)</button>
</div>

<div class="resize-handle" id="resizeHandle">
  <div class="screen">

    <!-- Header -->
    <div class="header">
      <span class="logo">IntelliAttend</span>
      <div class="divider"></div>
      <div class="course-info">
        <div class="course-name">MACHINE LEARNING</div>
        <div class="meta">
          <span>Dr. Smith</span>
          <span style="margin:0 16px">•</span>
          <span>Room 402</span>
        </div>
      </div>
      <div>
        <button style="padding:8px 20px;background:#0d9488;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:default;">End Session</button>
      </div>
    </div>

    <!-- Body -->
    <div class="body-row">

      <!-- Seating grid -->
      <div class="seating">
        <div class="grid">
          <div class="seat present">01</div>
          <div class="seat">02</div>
          <div class="seat present">03</div>
          <div class="seat">04</div>
          <div class="seat present">05</div>
          <div class="seat">06</div>
          <div class="seat">07</div>
          <div class="seat present">08</div>
          <div class="seat">09</div>
          <div class="seat">10</div>
          <div class="seat present">11</div>
          <div class="seat">12</div>
          <div class="seat">13</div>
          <div class="seat">14</div>
          <div class="seat present">15</div>
          <div class="seat">16</div>
          <div class="seat present">17</div>
          <div class="seat">18</div>
          <div class="seat">19</div>
          <div class="seat">20</div>
        </div>
        <div class="legend">
          <span><span class="legend-dot" style="background:#84cc16;"></span>PRESENT</span>
          <span><span class="legend-dot" style="background:#e2e8f0;"></span>EMPTY</span>
        </div>
      </div>

      <!-- QR Arena -->
      <div class="qr-arena">
        <div class="badge"><span class="badge-dot"></span>LIVE SESSION ACTIVE</div>
        <div class="qr-container">
          <div class="qr-inner" id="qrContainer"></div>
        </div>
        <div class="timer-area">
          <div class="timer-label">TIME REMAINING</div>
          <div class="timer-value">04:32</div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <div>
        <div class="label">ATTENDANCE RATE</div>
        <div>
          <span class="count">5</span>
          <span class="total"> / 20</span>
          <span style="margin-left:12px;padding:2px 8px;border-radius:100px;background:rgba(132,204,22,0.1);font-size:11px;font-weight:bold;color:#84cc16;">25%</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  function generateMockQR(container) {
    // Draw a mock QR pattern
    const size = Math.min(container.clientWidth, container.clientHeight);
    if (size < 50) return;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const modules = 25;
    const cell = size / (modules + 8);
    const margin = 4 * cell;

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);

    // Finder patterns
    for (let fp of [[0,0],[0,modules-7],[modules-7,0]]) {
      ctx.fillStyle = '#000';
      ctx.fillRect(margin + fp[0]*cell, margin + fp[1]*cell, 7*cell, 7*cell);
      ctx.fillStyle = '#fff';
      ctx.fillRect(margin + fp[0]*cell + cell, margin + fp[1]*cell + cell, 5*cell, 5*cell);
      ctx.fillStyle = '#000';
      ctx.fillRect(margin + fp[0]*cell + 2*cell, margin + fp[1]*cell + 2*cell, 3*cell, 3*cell);
    }

    // Data modules (pseudo-random pattern)
    for (let r = 0; r < modules; r++) {
      for (let c = 0; c < modules; c++) {
        if (r < 7 && c < 7) continue;
        if (r < 7 && c >= modules - 7) continue;
        if (r >= modules - 7 && c < 7) continue;
        if ((r * 7 + c * 13) % 3 !== 0) continue;
        ctx.fillStyle = '#000';
        ctx.fillRect(margin + c*cell + 1, margin + r*cell + 1, cell - 2, cell - 2);
      }
    }

    container.innerHTML = '';
    container.appendChild(canvas);
  }

  function updateQR() {
    const container = document.getElementById('qrContainer');
    generateMockQR(container);
  }

  function setSize(w, h) {
    const handle = document.getElementById('resizeHandle');
    handle.style.width = w + 'px';
    handle.style.height = h + 'px';
    document.getElementById('sizeLabel').textContent = w + ' × ' + h;
    // Trigger QR resize
    setTimeout(updateQR, 50);
  }

  // Observe resize
  const ro = new ResizeObserver(() => {
    updateQR();
    const handle = document.getElementById('resizeHandle');
    document.getElementById('sizeLabel').textContent = handle.clientWidth + ' × ' + handle.clientHeight;
  });
  ro.observe(document.getElementById('resizeHandle'));

  // Initial render
  setTimeout(updateQR, 100);
</script>

</body>
</html>
