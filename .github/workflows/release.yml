# ─────────────────────────────────────────────────────────────────────────────
# Release Workflow — IntelliAttend SmartBoard
#
# Triggered when a tag matching `v*` is pushed. Builds a Windows release,
# packages with Inno Setup, uploads as a GitHub Release artifact, and
# generates a version manifest that boards can poll to discover the update.
#
# Required repository secrets:
#   - FIREBASE_API_KEY              Firebase Web API key
#   - FIREBASE_APP_ID               Firebase App ID
#   - FIREBASE_MESSAGING_SENDER_ID  Firebase Cloud Messaging sender ID
#   - SSL_PIN_FINGERPRINT            SHA-256 hash of production TLS certificate
#   - SIGN_CERT_BASE64              Base64-encoded Authenticode signing certificate (optional)
#   - SIGN_PASSWORD                 Certificate password (optional)
#   - DEPLOY_KEY                    Server deploy key (POST /api/v1/board/ci-upload)
#
# Required repository variables:
#   - API_BASE_URL         Production API base URL (e.g. https://api.intelliattend.com)
#   - FIREBASE_PROJECT_ID  Firebase project ID
#   - SERVER_URL           IntelliAttend Server public URL (e.g. https://api.intelliattend.app)
#
# ── Workflow ────────────────────────────────────────────────────────────────
#   1. Checkout + install Flutter
#   2. Build `flutter build windows --release`
#   3. Package with Inno Setup → single setup.exe
#   4. Authenticode-sign the setup.exe (if cert present)
#   5. Compute SHA-256
#   6. Upload setup.exe + SHA-256 as release assets
#   7. Publish version manifest (latest.json)
#   8. Create GitHub Release
#   9. Upload installer to IntelliAttend server (POST /api/v1/board/ci-upload) so
#      the Admin Panel download and board auto-update serve the same canonical file.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'  # e.g. v5.5.0, v5.5.1

  # Allow manual trigger from the Actions tab for emergency hotfixes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true
        type: string

permissions:
  contents: write   # required by softprops/action-gh-release to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: IntelliAttendSmartBoard
  BUILD_CONFIG: release

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    env:
      HAS_SIGN_CERT: ${{ secrets.SIGN_CERT_BASE64 != '' }}

    steps:
      - name: Verify SSL certificate fingerprint
        shell: pwsh
        run: |
          $apiHost = "api.intelliattend.app"
          $expected = "${{ secrets.SSL_PIN_FINGERPRINT }}"

          Write-Host "Verifying SSL pin for ${apiHost}..." -ForegroundColor Cyan

          try {
            $tcp = New-Object System.Net.Sockets.TcpClient($apiHost, 443)
            $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, { $true })
            $ssl.AuthenticateAsClient($apiHost)
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($ssl.RemoteCertificate)
            $ssl.Close()
            $tcp.Close()

            $actual = $cert.GetCertHashString('sha256').ToLower()
            $daysLeft = ($cert.NotAfter - (Get-Date)).Days
            Write-Host "Server cert SHA-256: $actual"
            Write-Host "Expected pin:        $expected"
            Write-Host "Expires in:          $daysLeft days"

            if ($daysLeft -lt 14) {
              Write-Host "WARNING: Certificate expires in $daysLeft days!" -ForegroundColor Yellow
            }

            if ($actual -ne $expected) {
              Write-Host ""
              Write-Host "ERROR: SSL fingerprint mismatch!" -ForegroundColor Red
              Write-Host "The production cert has been renewed. Update SSL_PIN_FINGERPRINT secret:" -ForegroundColor Yellow
              Write-Host "  gh secret set SSL_PIN_FINGERPRINT --body '$actual'" -ForegroundColor White
              exit 1
            }

            Write-Host "SSL pin verified" -ForegroundColor Green
          } catch {
            Write-Host "WARNING: Could not verify SSL pin: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Proceeding with build (will rely on runtime fallback)" -ForegroundColor Yellow
          }

      - name: Validate required variables
        shell: pwsh
        run: |
          $apiUrl = "${{ vars.API_BASE_URL }}"
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            Write-Host "ERROR: API_BASE_URL variable is not set. Cannot build release without a production API URL." -ForegroundColor Red
            exit 1
          }
          Write-Host "API_BASE_URL: $apiUrl"

          $projectId = "${{ vars.FIREBASE_PROJECT_ID }}"
          if ([string]::IsNullOrWhiteSpace($projectId)) {
            Write-Host "ERROR: FIREBASE_PROJECT_ID variable is not set." -ForegroundColor Red
            exit 1
          }
          Write-Host "FIREBASE_PROJECT_ID: $projectId"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dispatchVersion = "${{ inputs.version }}"
          # On workflow_dispatch the tag may not be the version; use the input instead.
          if ($dispatchVersion -ne '') {
            $tag = $dispatchVersion
            if (-not ($tag -match '^v\d+\.\d+\.\d+')) {
              $tag = "v$($dispatchVersion)"
            }
          }
          if (-not ($tag -match '^v\d+\.\d+\.\d+')) {
            Write-Host "Tag '$tag' does not match vX.Y.Z — aborting"
            exit 1
          }
          Write-Host "Building version: $tag"
          "resolved_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: validate

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file from secrets
        run: |
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
          echo "LOCAL_API_URL=http://127.0.0.1:8000/v1/board/telemetry" >> .env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}" >> .env
          echo "ENABLE_DOCUMENTS=true" >> .env
          echo "DEBUG=false" >> .env

      - name: Run analyzer
        run: dart analyze lib/

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}
          --dart-define=ENABLE_DOCUMENTS=true
          --dart-define=DEBUG=false

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\intelliattend_smartboard.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: Build output not found at $exe" -Foreground Red
            exit 1
          }
          Write-Host "Build output size: $((Get-Item $exe).Length / 1MB) MB"

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "ERROR: ISCC.exe not found after install" -ForegroundColor Red
            exit 1
          }
          Write-Host "Inno Setup found: $iscc" -ForegroundColor Green

      - name: Build Installer
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.resolved_tag }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }

          & $iscc /DAppVersion="$version" /DSourceDir="$env:GITHUB_WORKSPACE\$buildDir" "$env:GITHUB_WORKSPACE\windows\inno_setup\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Inno Setup compilation failed" -ForegroundColor Red
            exit 1
          }

          # Inno Setup outputs IntelliAttendSmartBoard-{version}-Setup.exe (PascalCase)
          $setupExe = "$buildDir\${{ env.APP_NAME }}-$version-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Host "ERROR: setup.exe not found at $setupExe" -ForegroundColor Red
            Get-ChildItem $buildDir -Filter "*Setup*" | ForEach-Object { Write-Host "  Found: $($_.Name)" }
            exit 1
          }

          $sizeMB = [math]::Round((Get-Item $setupExe).Length / 1MB, 2)
          Write-Host "Installer created: $setupExe ($sizeMB MB)" -ForegroundColor Green

      - name: Sign Installer (Authenticode)
        if: ${{ env.HAS_SIGN_CERT == 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.resolved_tag }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"
          $setupExe = "$buildDir\${{ env.APP_NAME }}-$version-Setup.exe"

          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGN_CERT_BASE64 }}")
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            $password = ConvertTo-SecureString "${{ secrets.SIGN_PASSWORD }}" -AsPlainText -Force
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $password)
            
            Set-AuthenticodeSignature -FilePath $setupExe -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
            Write-Host "Installer signed successfully" -Foreground Green
          } finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.resolved_tag }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"
          $setupExe = "$buildDir\${{ env.APP_NAME }}-$version-Setup.exe"

          $hash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"

          $hashFile = "$buildDir\${{ env.APP_NAME }}-$version.sha256"
          $hash | Out-File -FilePath $hashFile -NoNewline
          Write-Host "Hash written to: $hashFile"

          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: hash

      - name: Create version manifest
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.resolved_tag }}"
          $version = $tag -replace '^v', ''
          $sha256 = "${{ steps.hash.outputs.sha256 }}"

          $manifest = @{
            latest_version = $version
            download_url    = "https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.APP_NAME }}-$version-Setup.exe"
            sha256          = $sha256
            release_date    = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            force           = $false
            rollout_percentage = 100
            minimum_version = $version
            release_notes   = "See ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          }

          $manifestPath = "build\windows\x64\runner\Release\latest.json"
          $manifest | ConvertTo-Json | Out-File -FilePath $manifestPath -Encoding UTF8
          Write-Host "Manifest created: $manifestPath"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.validate.outputs.resolved_tag }}
          path: |
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.validate.outputs.resolved_tag }}
          name: Release ${{ steps.validate.outputs.resolved_tag }}
          body: |
            ## IntelliAttend SmartBoard ${{ steps.validate.outputs.resolved_tag }}

            Download `IntelliAttendSmartBoard-${{ steps.validate.outputs.resolved_tag }}-Setup.exe` and double-click to install.

            ### Verification
            SHA-256: `${{ steps.hash.outputs.sha256 }}`
          files: |
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json
          draft: false
          prerelease: false

      - name: Compute Flutter version
        shell: pwsh
        run: |
          $tag = "${{ steps.validate.outputs.resolved_tag }}"
          $setupVersion = $tag -replace '^v', ''
          $parts = $setupVersion.Split('.')
          if ($parts.Count -eq 4) {
            $flutterVersion = "$($parts[0]).$($parts[1]).$($parts[2])+$($parts[3])"
          } else {
            $flutterVersion = $setupVersion
          }
          "setup_version=$setupVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "flutter_version=$flutterVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag -> Setup: $setupVersion -> Flutter: $flutterVersion"
        id: version

      - name: Wait for server ready
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: |
          SERVER_URL="${{ vars.SERVER_URL }}"
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVER_URL}/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "000" ]; then
              echo "Server ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Waiting for server... (attempt $i/$MAX_ATTEMPTS, HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "Warning: Server health check incomplete, proceeding with upload anyway"

      - name: Upload installer to IntelliAttend server
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: |
          SETUP_VERSION="${{ steps.version.outputs.setup_version }}"
          FLUTTER_VERSION="${{ steps.version.outputs.flutter_version }}"
          SETUP_PATH="build/windows/x64/runner/Release/${{ env.APP_NAME }}-${SETUP_VERSION}-Setup.exe"
          SERVER_URL="${{ vars.SERVER_URL }}"
          echo "Uploading v${FLUTTER_VERSION} (Setup: ${SETUP_VERSION}) to ${SERVER_URL}..."
          MAX_RETRIES=10
          RETRY_DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
              -X POST "${SERVER_URL}/api/v1/board/ci-upload" \
              -H "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
              -F "version=${SETUP_VERSION}" \
              -F "flutter_version=${FLUTTER_VERSION}" \
              -F "release_notes=Auto-deploy from commit ${{ github.sha }}" \
              -F "commit_hash=${{ github.sha }}" \
              -F "force=true" \
              -F "rollout_percentage=100" \
              -F "file=@${SETUP_PATH}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully uploaded v${FLUTTER_VERSION}"
              cat /tmp/upload_response.json
              exit 0
            fi
            RESPONSE=$(cat /tmp/upload_response.json 2>/dev/null || echo "No response body")
            echo "Attempt $i/$MAX_RETRIES failed (HTTP $HTTP_CODE): $RESPONSE"
            if [ "$HTTP_CODE" = "401" ]; then
              echo "ERROR: Invalid deploy key"
              exit 1
            fi
            if [ "$HTTP_CODE" = "413" ]; then
              echo "ERROR: File too large"
              exit 1
            fi
            if [ "$HTTP_CODE" = "422" ]; then
              echo "ERROR: Invalid request parameters"
              exit 1
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          echo "ERROR: Upload failed after $MAX_RETRIES attempts"
          exit 1
