# ─────────────────────────────────────────────────────────────────────────────
# Release Workflow — IntelliAttend SmartBoard
#
# Triggered when a tag matching `v*` is pushed. Builds a Windows MSI release,
# uploads it as a GitHub Release artifact, and generates a version manifest
# that boards can poll to discover the update.
#
# Required repository secrets:
#   - FIREBASE_API_KEY              Firebase Web API key
#   - FIREBASE_APP_ID               Firebase App ID
#   - FIREBASE_MESSAGING_SENDER_ID  Firebase Cloud Messaging sender ID
#   - SSL_PIN_FINGERPRINT            SHA-256 hash of production TLS certificate
#   - WIX_SIGN_CERT_BASE64          Base64-encoded Authenticode signing certificate (optional)
#   - WIX_SIGN_PASSWORD             Certificate password (optional)
#
# Required repository variables:
#   - API_BASE_URL         Production API base URL (e.g. https://api.intelliattend.com)
#   - FIREBASE_PROJECT_ID  Firebase project ID
#
# ── Workflow ────────────────────────────────────────────────────────────────
#   1. Checkout + install Flutter
#   2. Build `flutter build windows --release`
#   3. Package MSI via candle + light (WiX Toolset)
#   4. Authenticode-sign the MSI (if cert present)
#   5. Compute SHA-256
#   6. Upload MSI + SHA-256 as release assets
#   7. Publish version manifest (latest.json)
#   8. Create GitHub Release
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v*'  # e.g. v5.5.0, v5.5.1

  # Allow manual trigger from the Actions tab for emergency hotfixes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true
        type: string

permissions:
  contents: write   # required by softprops/action-gh-release to create releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: IntelliAttendSmartBoard
  BUILD_CONFIG: release

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest
    env:
      HAS_SIGN_CERT: ${{ secrets.WIX_SIGN_CERT_BASE64 != '' }}

    steps:
      - name: Verify SSL certificate fingerprint
        shell: pwsh
        run: |
          $apiHost = "api.intelliattend.app"
          $expected = "${{ secrets.SSL_PIN_FINGERPRINT }}"

          Write-Host "Verifying SSL pin for ${apiHost}..." -ForegroundColor Cyan

          try {
            $tcp = New-Object System.Net.Sockets.TcpClient($apiHost, 443)
            $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, { $true })
            $ssl.AuthenticateAsClient($apiHost)
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($ssl.RemoteCertificate)
            $ssl.Close()
            $tcp.Close()

            $actual = $cert.GetCertHashString('sha256').ToLower()
            $daysLeft = ($cert.NotAfter - (Get-Date)).Days
            Write-Host "Server cert SHA-256: $actual"
            Write-Host "Expected pin:        $expected"
            Write-Host "Expires in:          $daysLeft days"

            if ($daysLeft -lt 14) {
              Write-Host "WARNING: Certificate expires in $daysLeft days!" -ForegroundColor Yellow
            }

            if ($actual -ne $expected) {
              Write-Host ""
              Write-Host "ERROR: SSL fingerprint mismatch!" -ForegroundColor Red
              Write-Host "The production cert has been renewed. Update SSL_PIN_FINGERPRINT secret:" -ForegroundColor Yellow
              Write-Host "  gh secret set SSL_PIN_FINGERPRINT --body '$actual'" -ForegroundColor White
              exit 1
            }

            Write-Host "SSL pin verified" -ForegroundColor Green
          } catch {
            Write-Host "WARNING: Could not verify SSL pin: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Proceeding with build (will rely on runtime fallback)" -ForegroundColor Yellow
          }

      - name: Validate required variables
        shell: pwsh
        run: |
          $apiUrl = "${{ vars.API_BASE_URL }}"
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            Write-Host "ERROR: API_BASE_URL variable is not set. Cannot build release without a production API URL." -ForegroundColor Red
            exit 1
          }
          Write-Host "API_BASE_URL: $apiUrl"

          $projectId = "${{ vars.FIREBASE_PROJECT_ID }}"
          if ([string]::IsNullOrWhiteSpace($projectId)) {
            Write-Host "ERROR: FIREBASE_PROJECT_ID variable is not set." -ForegroundColor Red
            exit 1
          }
          Write-Host "FIREBASE_PROJECT_ID: $projectId"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match '^v\d+\.\d+\.\d+')) {
            Write-Host "Tag '$tag' does not match vX.Y.Z — aborting"
            exit 1
          }
          Write-Host "Building version: $tag"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: dart analyze lib/

      - name: Run tests
        run: flutter test

      - name: Create .env file from secrets
        run: |
          echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
          echo "LOCAL_API_URL=http://127.0.0.1:8000/v1/board/telemetry" >> .env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env
          echo "FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}" >> .env
          echo "ENABLE_DOCUMENTS=true" >> .env
          echo "DEBUG=false" >> .env

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}
          --dart-define=ENABLE_DOCUMENTS=true
          --dart-define=DEBUG=false

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: Build output not found at $exe" -Foreground Red
            exit 1
          }
          Write-Host "Build output size: $((Get-Item $exe).Length / 1MB) MB"

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          # WiX Toolset v3 is available via Chocolatey.
          # Install if not already present.
          $wixPath = "$env:WIX"
          if (-not (Test-Path "$wixPath\bin\candle.exe")) {
            choco install wixtoolset --no-progress -y
          }
          $wixPath = "$env:WIX"
          Write-Host "WiX installed at: $wixPath"
          Write-Host "candle: $(Get-Command "$wixPath\bin\candle.exe" | Select-Object -ExpandProperty Source)"
          Write-Host "light:  $(Get-Command "$wixPath\bin\light.exe" | Select-Object -ExpandProperty Source)"

      - name: Package MSI
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"
          $installerDir = "windows\installer"

          # Build the MSI
          Push-Location $installerDir

          # Compile .wxs to .wixobj
          & "$env:WIX\bin\candle.exe" `
            -dAppName="${{ env.APP_NAME }}" `
            -dVersion="$version" `
            -dSourceDir="..\..\$buildDir" `
            -arch x64 `
            -ext WixUIExtension `
            product.wxs `
            -out product.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Link .wixobj to .msi
          & "$env:WIX\bin\light.exe" `
            -ext WixUIExtension `
            product.wixobj `
            -out "..\..\$buildDir\${{ env.APP_NAME }}-$version.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Pop-Location

          $msi = "$buildDir\${{ env.APP_NAME }}-$version.msi"
          if (-not (Test-Path $msi)) {
            Write-Host "ERROR: MSI not created at $msi" -Foreground Red
            exit 1
          }

          $msiSize = (Get-Item $msi).Length / 1MB
          Write-Host "MSI created: $msi ($([math]::Round($msiSize, 2)) MB)"

      - name: Build Bootstrapper
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"

          # Build bootstrapper EXE
          $bsBuildDir = "build\bootstrapper"
          if (-not (Test-Path $bsBuildDir)) { New-Item -ItemType Directory -Path $bsBuildDir -Force | Out-Null }

          Push-Location $bsBuildDir
          cmake.exe "$env:GITHUB_WORKSPACE\windows\bootstrapper" -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          cmake.exe --build . --config Release
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location

          $bsExe = "$bsBuildDir\bootstrapper.exe"
          if (-not (Test-Path $bsExe)) {
            Write-Host "ERROR: bootstrapper.exe not found" -ForegroundColor Red
            exit 1
          }

          # Copy to build output with proper name
          $bsDest = "$buildDir\${{ env.APP_NAME }}-${version}-x64-Setup.exe"
          Copy-Item $bsExe $bsDest -Force
          Write-Host "Bootstrapper: $bsDest" -ForegroundColor Green

      - name: Sign MSI (Authenticode)
        if: ${{ env.HAS_SIGN_CERT == 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"
          $msi = "$buildDir\${{ env.APP_NAME }}-$version.msi"

          # Decode the signing certificate
          $certBytes = [Convert]::FromBase64String("${{ secrets.WIX_SIGN_CERT_BASE64 }}")
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          try {
            # Sign the MSI with the certificate
            $password = ConvertTo-SecureString "${{ secrets.WIX_SIGN_PASSWORD }}" -AsPlainText -Force
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $password)
            
            Set-AuthenticodeSignature -FilePath $msi -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
            Write-Host "MSI signed successfully" -Foreground Green

            # Sign bootstrapper too
            $bs = "$buildDir\${{ env.APP_NAME }}-$version-x64-Setup.exe"
            if (Test-Path $bs) {
              Set-AuthenticodeSignature -FilePath $bs -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
              Write-Host "Bootstrapper signed successfully" -Foreground Green
            }
          } finally {
            # Clean up certificate file
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $buildDir = "build\windows\x64\runner\Release"
          $msi = "$buildDir\${{ env.APP_NAME }}-$version.msi"

          $hash = (Get-FileHash -Path $msi -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"

          # Write hash file
          $hashFile = "$buildDir\${{ env.APP_NAME }}-$version.sha256"
          $hash | Out-File -FilePath $hashFile -NoNewline
          Write-Host "Hash written to: $hashFile"

          # Write as step output for later use
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: hash

      - name: Create version manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $sha256 = "${{ steps.hash.outputs.sha256 }}"

          $manifest = @{
            latest_version = $version
            download_url    = "https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.APP_NAME }}-$version.msi"
            sha256          = $sha256
            release_date    = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            force           = $false
            rollout_percentage = 100
            minimum_version = $version
            release_notes   = "See ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          }

          $manifestPath = "build\windows\x64\runner\Release\latest.json"
          $manifest | ConvertTo-Json | Out-File -FilePath $manifestPath -Encoding UTF8
          Write-Host "Manifest created: $manifestPath"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            build\windows\x64\runner\Release\*.msi
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## IntelliAttend SmartBoard ${{ github.ref_name }}

            ### Installation
            Download the MSI below and run it on the classroom board.

            ### Verification
            SHA-256: `${{ steps.hash.outputs.sha256 }}`

            ### Changelog
            See the commit history for details.
          files: |
            build\windows\x64\runner\Release\*.msi
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json
          draft: false
          prerelease: false
