# ─────────────────────────────────────────────────────────────────────────────
# Auto-Deploy Workflow — IntelliAttend SmartBoard
#
# Triggered on push to school-main. Automatically:
#   1. Builds Windows app via Flutter
#   2. Packages with Inno Setup → single setup.exe
#   3. Creates GitHub Release with version tag
#   4. Publishes latest.json manifest for auto-update
#
# SmartBoard devices poll latest.json and auto-download new versions.
#
# Required repository secrets:
#   - FIREBASE_API_KEY              Firebase Web API key
#   - FIREBASE_APP_ID               Firebase App ID
#   - FIREBASE_MESSAGING_SENDER_ID  Firebase Cloud Messaging sender ID
#   - SSL_PIN_FINGERPRINT            SHA-256 hash of production TLS certificate
#   - SIGN_CERT_BASE64              Base64-encoded Authenticode signing certificate (optional)
#   - SIGN_PASSWORD                 Certificate password (optional)
#   - DEPLOY_KEY                    Server deploy key for CI upload
#
# Required repository variables:
#   - API_BASE_URL         Production API base URL (e.g. https://api.intelliattend.com)
#   - FIREBASE_PROJECT_ID  Firebase project ID
#   - SERVER_URL           Backend server URL for CI upload (optional)
# ─────────────────────────────────────────────────────────────────────────────

name: Auto-Deploy

on:
  push:
    branches: [school-main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: windows-latest

    steps:
      - name: Validate required variables
        shell: pwsh
        run: |
          $required = @{
            "API_BASE_URL" = "${{ vars.API_BASE_URL }}"
            "FIREBASE_PROJECT_ID" = "${{ vars.FIREBASE_PROJECT_ID }}"
          }
          $secrets = @{
            "FIREBASE_API_KEY" = "${{ secrets.FIREBASE_API_KEY }}"
            "FIREBASE_APP_ID" = "${{ secrets.FIREBASE_APP_ID }}"
            "FIREBASE_MESSAGING_SENDER_ID" = "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
            "SSL_PIN_FINGERPRINT" = "${{ secrets.SSL_PIN_FINGERPRINT }}"
          }
          $missing = @()
          foreach ($kv in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($kv.Value)) {
              $missing += $kv.Key
            } else {
              Write-Host "$($kv.Key): $($kv.Value)"
            }
          }
          foreach ($kv in $secrets.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($kv.Value)) {
              $missing += $kv.Key
            } else {
              Write-Host "$($kv.Key): [SET]"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: Missing required variables/secrets: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }

      - name: Verify SSL certificate fingerprint
        shell: pwsh
        run: |
          $apiHost = "api.intelliattend.app"
          $expected = "${{ secrets.SSL_PIN_FINGERPRINT }}"

          Write-Host "Verifying SSL pin for ${apiHost}..." -ForegroundColor Cyan

          try {
            $tcp = New-Object System.Net.Sockets.TcpClient($apiHost, 443)
            $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, { $true })
            $ssl.AuthenticateAsClient($apiHost)
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($ssl.RemoteCertificate)
            $ssl.Close()
            $tcp.Close()

            $actual = $cert.GetCertHashString('sha256').ToLower()
            $daysLeft = ($cert.NotAfter - (Get-Date)).Days
            Write-Host "Server cert SHA-256: $actual"
            Write-Host "Expected pin:        $expected"
            Write-Host "Expires in:          $daysLeft days"

            if ($daysLeft -lt 14) {
              Write-Host "WARNING: Certificate expires in $daysLeft days!" -ForegroundColor Yellow
            }

            if ($actual -ne $expected) {
              Write-Host ""
              Write-Host "ERROR: SSL fingerprint mismatch!" -ForegroundColor Red
              Write-Host "The production cert has been renewed. Update SSL_PIN_FINGERPRINT secret:" -ForegroundColor Yellow
              Write-Host "  gh secret set SSL_PIN_FINGERPRINT --body '$actual'" -ForegroundColor White
              exit 1
            }

            Write-Host "SSL pin verified" -ForegroundColor Green
          } catch {
            Write-Host "WARNING: Could not verify SSL pin: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Proceeding with build (will rely on runtime fallback)" -ForegroundColor Yellow
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          # Read version from pubspec.yaml
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)') {
            $major = $Matches[1]
            $minor = $Matches[2]
            $patch = $Matches[3]
            $build = [int]$Matches[4] + 1
            $version = "$major.$minor.$patch.$build"
            $flutterVersion = "$major.$minor.$patch+$build"
          } else {
            Write-Host "ERROR: Could not parse version from pubspec.yaml" -ForegroundColor Red
            exit 1
          }
          $tag = "v$version"
          Write-Host "Version: $version (Flutter: $flutterVersion)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "flutter_version=$flutterVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          API_BASE_URL=${{ vars.API_BASE_URL }}
          LOCAL_API_URL=http://127.0.0.1:8000/v1/board/telemetry
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}
          ENABLE_DOCUMENTS=true
          DEBUG=false
          ENVEOF
          cat .env

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: dart analyze lib/

      - name: Run tests
        run: flutter test

      - name: Update version in pubspec
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.flutter_version }}"
          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = $pubspec -replace 'version: .*', "version: $version"
          [System.IO.File]::WriteAllText("pubspec.yaml", $pubspec)
          Write-Host "Updated pubspec.yaml to version $version"

      - name: Clean build artifacts
        shell: bash
        run: flutter clean

      - name: Get dependencies (post-clean)
        run: flutter pub get

      - name: Build Windows release
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=SSL_PIN_FINGERPRINT="${{ secrets.SSL_PIN_FINGERPRINT }}" \
            --dart-define=ENABLE_DOCUMENTS=true \
            --dart-define=DEBUG=false

      - name: Validate build artifacts
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem -Path $buildDir -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: No .exe found in $buildDir" -ForegroundColor Red
            exit 1
          }

          # Check critical DLLs exist
          $criticalDlls = @(
            "flutter_windows.dll",
            "flutter_secure_storage_windows_plugin.dll",
            "isar.dll",
            "window_manager_plugin.dll",
            "audioplayers_windows_plugin.dll",
            "connectivity_plus_plugin.dll"
          )
          foreach ($dll in $criticalDlls) {
            $path = Join-Path $buildDir $dll
            if (-not (Test-Path $path)) {
              Write-Host "ERROR: Missing critical DLL: $dll" -ForegroundColor Red
              exit 1
            }
          }

          # flutter_windows.dll is a pre-compiled SDK artifact — its timestamp
          # reflects the SDK release date, not the current build.  Checking
          # file size > 1 KB as a basic sanity check instead.

          $flutterDll = Join-Path $buildDir "flutter_windows.dll"
          $flutterSize = (Get-Item $flutterDll).Length
          if ($flutterSize -lt 1024) {
            Write-Host "ERROR: flutter_windows.dll is suspiciously small ($flutterSize bytes) — may be corrupt" -ForegroundColor Red
            exit 1
          }

          Write-Host "Build artifact validation PASSED" -ForegroundColor Green
          Write-Host "Exe: $($exe.Name) ($([math]::Round($exe.Length / 1KB)) KB) — $exeTime"
          Get-ChildItem -Path $buildDir -Filter *.dll | ForEach-Object {
            Write-Host "  $($_.Name): $([math]::Round($_.Length / 1KB)) KB — $($_.LastWriteTime)"
          }

      - name: Detect exe name
        id: detect
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem -Path $buildDir -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: No .exe found" -Foreground Red
            exit 1
          }
          Write-Host "Found: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          "app_name=$($exe.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Copy update_agent.exe to bundle
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $agentCandidates = @(
            "build\windows\x64\update_agent\Release\update_agent.exe",
            "build\windows\x64\update_agent\update_agent.exe",
            "build\windows\x64\update_agent\DebRel\update_agent.exe"
          )
          $agentExe = $null
          foreach ($c in $agentCandidates) {
            if (Test-Path $c) { $agentExe = $c; break }
          }
          if (-not $agentExe) {
            Write-Host "ERROR: update_agent.exe not found in build output" -ForegroundColor Red
            Write-Host "Searching..." -ForegroundColor Yellow
            Get-ChildItem -Path "build\windows\x64" -Filter "update_agent.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
              $agentExe = $_.FullName
            }
            if (-not $agentExe) {
              exit 1
            }
          }
          Copy-Item $agentExe "$buildDir\update_agent.exe" -Force
          Write-Host "Copied update_agent.exe from $agentExe to $buildDir" -ForegroundColor Green

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "ERROR: ISCC.exe not found after install" -ForegroundColor Red
            exit 1
          }
          Write-Host "Inno Setup found: $iscc" -ForegroundColor Green

      - name: Build Installer
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $appName = "${{ steps.detect.outputs.app_name }}"
          $buildDir = "build\windows\x64\runner\Release"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }

          & $iscc /DAppVersion="$version" /DSourceDir="$env:GITHUB_WORKSPACE\$buildDir" "$env:GITHUB_WORKSPACE\windows\inno_setup\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Inno Setup compilation failed" -ForegroundColor Red
            exit 1
          }

          $setupExe = "$buildDir\$appName-$version-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Host "ERROR: setup.exe not found at $setupExe" -ForegroundColor Red
            Get-ChildItem $buildDir -Filter "*Setup*" | ForEach-Object { Write-Host "  Found: $($_.Name)" }
            exit 1
          }

          # Sign the setup.exe if certificate is available
          if ("${{ secrets.SIGN_CERT_BASE64 }}" -ne "") {
            $certBytes = [Convert]::FromBase64String("${{ secrets.SIGN_CERT_BASE64 }}")
            $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            try {
              $password = ConvertTo-SecureString "${{ secrets.SIGN_PASSWORD }}" -AsPlainText -Force
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $password)
              Set-AuthenticodeSignature -FilePath $setupExe -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
              Write-Host "Installer signed successfully" -ForegroundColor Green
            } finally {
              if (Test-Path $certPath) { Remove-Item $certPath -Force }
            }
          } else {
            Write-Host "Warning: No signing certificate — installer is unsigned" -ForegroundColor Yellow
          }

          $sha256 = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer: $setupExe"
          Write-Host "SHA-256: $sha256"

          Set-Content -Path "$buildDir\$appName-$version.sha256" -Value $sha256 -Encoding UTF8

          $sizeMB = [math]::Round((Get-Item $setupExe).Length / 1MB, 2)
          Write-Host "Installer size: $sizeMB MB" -ForegroundColor Green

          "setup_name=$appName-$version-Setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create version manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $flutterVersion = "${{ steps.version.outputs.flutter_version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $sha256 = "${{ steps.installer.outputs.sha256 }}"
          $setupName = "${{ steps.installer.outputs.setup_name }}"

          $buildDir = "build\windows\x64\runner\Release"
          $exeTime = (Get-ChildItem "$buildDir\*.exe" | Select-Object -First 1).LastWriteTime

          $manifest = @{
            latest_version = $flutterVersion
            download_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
            sha256 = $sha256
            force = $true
            rollout_percentage = 100
            minimum_version = $flutterVersion
            build_timestamp = $exeTime.ToString("o")
            flutter_sdk = "3.44.6"
          }

          $manifest | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\latest.json" -Encoding UTF8
          Write-Host "Manifest created"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            Download `IntelliAttendSmartBoard-${{ steps.version.outputs.version }}-Setup.exe` and double-click to install.
          files: |
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json
          draft: false
          prerelease: false

      - name: Wait for server to be ready
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: |
          SERVER_URL="${{ vars.SERVER_URL }}"
          echo "Waiting for server to be ready at ${SERVER_URL}..."
          
          MAX_ATTEMPTS=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVER_URL}/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready (attempt $i)"
              break
            fi
            echo "Waiting for server... (attempt $i/$MAX_ATTEMPTS, HTTP $HTTP_CODE)"
            sleep 5
          done
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Warning: Server may not be fully ready, proceeding with upload anyway"
          fi

      - name: Upload to server
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FLUTTER_VERSION="${{ steps.version.outputs.flutter_version }}"
          APP_NAME="${{ steps.detect.outputs.app_name }}"
          SETUP_PATH="build/windows/x64/runner/Release/${APP_NAME}-${VERSION}-Setup.exe"
          SERVER_URL="${{ vars.SERVER_URL }}"
          
          echo "Uploading v${FLUTTER_VERSION} (Setup: ${VERSION}) to ${SERVER_URL}..."
          
          MAX_RETRIES=10
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
              -X POST "${SERVER_URL}/api/v1/board/ci-upload" \
              -H "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
              -F "version=${FLUTTER_VERSION}" \
              -F "release_notes=Auto-deploy from commit ${{ github.sha }}" \
              -F "commit_hash=${{ github.sha }}" \
              -F "force=true" \
              -F "rollout_percentage=100" \
              -F "file=@${SETUP_PATH}")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully uploaded v${FLUTTER_VERSION}"
              cat /tmp/upload_response.json
              exit 0
            fi
            
            RESPONSE=$(cat /tmp/upload_response.json 2>/dev/null || echo "No response body")
            echo "Attempt $i/$MAX_RETRIES failed (HTTP $HTTP_CODE): $RESPONSE"
            
            if [ "$HTTP_CODE" = "401" ]; then
              echo "ERROR: Invalid deploy key — check DEPLOY_KEY secret matches server"
              exit 1
            fi
            
            if [ "$HTTP_CODE" = "413" ]; then
              echo "ERROR: File too large — check server upload size limits"
              exit 1
            fi
            
            if [ "$HTTP_CODE" = "422" ]; then
              echo "ERROR: Invalid request parameters"
              exit 1
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "ERROR: Upload failed after $MAX_RETRIES attempts"
          exit 1
