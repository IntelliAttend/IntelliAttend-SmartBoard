# ─────────────────────────────────────────────────────────────────────────────
# Auto-Deploy Workflow — IntelliAttend SmartBoard
#
# Triggered on push to school-main. Automatically:
#   1. Builds Windows app via Flutter
#   2. Packages with Inno Setup → single setup.exe
#   3. Creates GitHub Release with version tag + full artifact set
#   4. Archives validation evidence (checksums, build-info, agent, symbols)
#
# FLEET PROMOTION IS GATED (Phase 2 validation):
#   Boards are updated via ci-upload (force=true, rollout 100%). This step runs
#   ONLY on a manual workflow_dispatch with promote=true. Every other push builds
#   + archives but never touches the fleet. During hardware validation the fleet
#   must stay frozen until all 40 pending scenarios have evidence.
#
# SmartBoard devices poll latest.json and auto-download new versions.
#
# Required repository secrets:
#   - FIREBASE_API_KEY              Firebase Web API key
#   - FIREBASE_APP_ID               Firebase App ID
#   - FIREBASE_MESSAGING_SENDER_ID  Firebase Cloud Messaging sender ID
#   - SSL_PIN_FINGERPRINT            SHA-256 hash of production TLS certificate
#   - SIGN_CERT_BASE64              Base64-encoded Authenticode signing certificate (REQUIRED — the update agent rejects unsigned binaries)
#   - SIGN_PASSWORD                 Certificate password (REQUIRED)
#   - DEPLOY_KEY                    Server deploy key for CI upload
#
# Required repository variables:
#   - API_BASE_URL         Production API base URL (e.g. https://api.intelliattend.com)
#   - FIREBASE_PROJECT_ID  Firebase project ID
#   - SERVER_URL           Backend server URL for CI upload (optional)
# ─────────────────────────────────────────────────────────────────────────────

name: Auto-Deploy

on:
  push:
    branches: [school-main]
    paths:
      - "lib/**"
      - "windows/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/auto-deploy.yml"
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote build to fleet (ci-upload with force=true, rollout 100%). Default off — fleet deploys are gated during Phase 2 validation.'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: windows-latest
    # A hang here previously blocked the runner for hours (e.g. a network-bound
    # Authenticode revocation check). Cap it so a stuck step fails fast instead.
    timeout-minutes: 60

    steps:
      - name: Validate required variables
        shell: pwsh
        run: |
          $required = @{
            "API_BASE_URL" = "${{ vars.API_BASE_URL }}"
            "FIREBASE_PROJECT_ID" = "${{ vars.FIREBASE_PROJECT_ID }}"
          }
          $secrets = @{
            "FIREBASE_API_KEY" = "${{ secrets.FIREBASE_API_KEY }}"
            "FIREBASE_APP_ID" = "${{ secrets.FIREBASE_APP_ID }}"
            "FIREBASE_MESSAGING_SENDER_ID" = "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
            "SSL_PIN_FINGERPRINT" = "${{ secrets.SSL_PIN_FINGERPRINT }}"
            "SIGN_CERT_BASE64" = "${{ secrets.SIGN_CERT_BASE64 }}"
            "SIGN_PASSWORD" = "${{ secrets.SIGN_PASSWORD }}"
          }
          $missing = @()
          foreach ($kv in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($kv.Value)) {
              $missing += $kv.Key
            } else {
              Write-Host "$($kv.Key): $($kv.Value)"
            }
          }
          foreach ($kv in $secrets.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($kv.Value)) {
              $missing += $kv.Key
            } else {
              Write-Host "$($kv.Key): [SET]"
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "ERROR: Missing required variables/secrets: $($missing -join ', ')" -ForegroundColor Red
            Write-Host ""
            Write-Host "SIGN_CERT_BASE64 + SIGN_PASSWORD are REQUIRED: the C++ update agent" -ForegroundColor Yellow
            Write-Host "(windows/update_agent/main.cpp) rejects unsigned installers and unsigned" -ForegroundColor Yellow
            Write-Host "app binaries. An unsigned release fails self-update on every board." -ForegroundColor Yellow
            exit 1
          }

      - name: Verify SSL certificate fingerprint
        shell: pwsh
        run: |
          $apiHost = "api.intelliattend.app"
          $expected = "${{ secrets.SSL_PIN_FINGERPRINT }}"

          Write-Host "Verifying SSL pin for ${apiHost}..." -ForegroundColor Cyan

          try {
            $tcp = New-Object System.Net.Sockets.TcpClient($apiHost, 443)
            $ssl = New-Object System.Net.Security.SslStream($tcp.GetStream(), $false, { $true })
            $ssl.AuthenticateAsClient($apiHost)
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($ssl.RemoteCertificate)
            $ssl.Close()
            $tcp.Close()

            $actual = $cert.GetCertHashString('sha256').ToLower()
            $daysLeft = ($cert.NotAfter - (Get-Date)).Days
            Write-Host "Server cert SHA-256: $actual"
            Write-Host "Expected pin:        $expected"
            Write-Host "Expires in:          $daysLeft days"

            if ($daysLeft -lt 14) {
              Write-Host "WARNING: Certificate expires in $daysLeft days!" -ForegroundColor Yellow
            }

            if ($actual -ne $expected) {
              Write-Host ""
              Write-Host "ERROR: SSL fingerprint mismatch!" -ForegroundColor Red
              Write-Host "The production cert has been renewed. Update SSL_PIN_FINGERPRINT secret:" -ForegroundColor Yellow
              Write-Host "  gh secret set SSL_PIN_FINGERPRINT --body '$actual'" -ForegroundColor White
              exit 1
            }

            Write-Host "SSL pin verified" -ForegroundColor Green
          } catch {
            Write-Host "WARNING: Could not verify SSL pin: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Proceeding with build (will rely on runtime fallback)" -ForegroundColor Yellow
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reserve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Reserve a strictly-increasing, collision-proof version by pushing a
          # git tag as a lock. If the tag already exists (concurrent run or a
          # previously-bumped floor), re-fetch pubspec.yaml and try the next one.
          for attempt in $(seq 1 30); do
            PUBSPEC="$(cat pubspec.yaml)"
            if [[ "$PUBSPEC" =~ version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              BUILD="$(( ${BASH_REMATCH[4]} + 1 ))"
            else
              echo "ERROR: could not parse version from pubspec.yaml" >&2
              exit 1
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
            FLUTTER_VERSION="${MAJOR}.${MINOR}.${PATCH}+${BUILD}"
            TAG="v${VERSION}"
            echo "[$attempt] attempting $VERSION ($FLUTTER_VERSION, $TAG)"
            if git tag "$TAG" 2>/dev/null && git push origin "$TAG" 2>/dev/null; then
              echo "Reserved version $VERSION (tag $TAG)"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "[$attempt] tag $TAG already exists — re-fetching bumped version floor"
            git fetch -q origin school-main
            git show FETCH_HEAD:pubspec.yaml > pubspec.yaml
          done
          echo "ERROR: could not reserve a unique version after 30 attempts" >&2
          exit 1

      - name: Bump pubspec and commit back to repository
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.flutter_version }}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          grep -q "^version: ${VERSION}$" pubspec.yaml || {
            echo "ERROR: failed to write version $VERSION into pubspec.yaml" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to $VERSION [skip ci]"
          # Keep the repo's version floor moving even if the build later fails.
          # [skip ci] prevents this commit from re-triggering any workflow.
          git pull --rebase origin school-main 2>/dev/null || true
          git push origin HEAD:school-main
          echo "Bumped pubspec to $VERSION and pushed to school-main"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << 'ENVEOF'
          API_BASE_URL=${{ vars.API_BASE_URL }}
          LOCAL_API_URL=http://127.0.0.1:8000/v1/board/telemetry
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SSL_PIN_FINGERPRINT=${{ secrets.SSL_PIN_FINGERPRINT }}
          ENABLE_DOCUMENTS=true
          DEBUG=false
          ENVEOF
          cat .env

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: dart analyze lib/

      - name: Run tests
        run: flutter test

      - name: Clean build artifacts
        shell: bash
        run: flutter clean

      - name: Get dependencies (post-clean)
        run: flutter pub get

      - name: Build Windows release
        shell: bash
        run: |
          flutter build windows --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=SSL_PIN_FINGERPRINT="${{ secrets.SSL_PIN_FINGERPRINT }}" \
            --dart-define=ENABLE_DOCUMENTS=true \
            --dart-define=DEBUG=false

      - name: Validate build artifacts
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem -Path $buildDir -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: No .exe found in $buildDir" -ForegroundColor Red
            exit 1
          }

          # Check critical DLLs exist
          $criticalDlls = @(
            "flutter_windows.dll",
            "flutter_secure_storage_windows_plugin.dll",
            "isar.dll",
            "window_manager_plugin.dll",
            "audioplayers_windows_plugin.dll",
            "connectivity_plus_plugin.dll"
          )
          foreach ($dll in $criticalDlls) {
            $path = Join-Path $buildDir $dll
            if (-not (Test-Path $path)) {
              Write-Host "ERROR: Missing critical DLL: $dll" -ForegroundColor Red
              exit 1
            }
          }

          # flutter_windows.dll is a pre-compiled SDK artifact — its timestamp
          # reflects the SDK release date, not the current build.  Checking
          # file size > 1 KB as a basic sanity check instead.

          $flutterDll = Join-Path $buildDir "flutter_windows.dll"
          $flutterSize = (Get-Item $flutterDll).Length
          if ($flutterSize -lt 1024) {
            Write-Host "ERROR: flutter_windows.dll is suspiciously small ($flutterSize bytes) — may be corrupt" -ForegroundColor Red
            exit 1
          }

          Write-Host "Build artifact validation PASSED" -ForegroundColor Green
          Write-Host "Exe: $($exe.Name) ($([math]::Round($exe.Length / 1KB)) KB) — $exeTime"
          Get-ChildItem -Path $buildDir -Filter *.dll | ForEach-Object {
            Write-Host "  $($_.Name): $([math]::Round($_.Length / 1KB)) KB — $($_.LastWriteTime)"
          }

      - name: Detect exe name
        id: detect
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem -Path $buildDir -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) {
            Write-Host "ERROR: No .exe found" -Foreground Red
            exit 1
          }
          Write-Host "Found: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 2)) MB)"
          "app_name=$($exe.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build update_agent.exe
        shell: pwsh
        run: |
          # flutter build windows does NOT compile the C++ update agent
          # (windows/update_agent). It must be built separately and bundled
          # with the app, otherwise every board fails with "Failed to launch
          # update agent" and self-update can never complete.
          $agentDir = "build\windows\x64\update_agent"
          New-Item -ItemType Directory -Force -Path $agentDir | Out-Null
          # No -G flag: GitHub runners ship the latest Visual Studio (18+), not
          # necessarily "Visual Studio 17 2022". Let CMake pick the default
          # generator and just pin the architecture.
          cmake -S windows\update_agent -B $agentDir -A x64
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: CMake configure for update_agent failed" -ForegroundColor Red
            exit 1
          }
          cmake --build $agentDir --config Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: update_agent.exe build failed" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "$agentDir\Release\update_agent.exe")) {
            Write-Host "ERROR: update_agent.exe not produced" -ForegroundColor Red
            exit 1
          }
          Write-Host "Built update_agent.exe: $agentDir\Release\update_agent.exe" -ForegroundColor Green

      - name: Stage update_agent.exe (kept OUT of app bundle)
        id: agent
        shell: pwsh
        run: |
          # Phase 1 isolation: update_agent.exe must NOT be copied into the
          # app bundle ({app}\*). If it shipped inside the app dir, the
          # installer's recursive {app} copy would overwrite the RUNNING agent
          # during self-update (Windows locks running exes) and the install
          # would fail. The agent lives in a dedicated dir outside {app} and is
          # installed there explicitly by setup.iss via /DAgentDir.
          $agentCandidates = @(
            "build\windows\x64\update_agent\Release\update_agent.exe",
            "build\windows\x64\update_agent\update_agent.exe",
            "build\windows\x64\update_agent\DebRel\update_agent.exe"
          )
          $agentExe = $null
          foreach ($c in $agentCandidates) {
            if (Test-Path $c) { $agentExe = $c; break }
          }
          if (-not $agentExe) {
            Write-Host "ERROR: update_agent.exe not found in build output" -ForegroundColor Red
            Get-ChildItem -Path "build\windows\x64" -Filter "update_agent.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
              $agentExe = $_.FullName
            }
            if (-not $agentExe) { exit 1 }
          }
          $agentDir = Split-Path -Parent $agentExe
          Write-Host "Staged update_agent.exe (kept out of app bundle): $agentExe" -ForegroundColor Green
          "agent_path=$env:GITHUB_WORKSPACE\$agentExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "agent_dir=$env:GITHUB_WORKSPACE\$agentDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign application binaries (required for self-update)
        shell: pwsh
        run: |
          # The C++ update agent (windows/update_agent/main.cpp) STRICTLY
          # requires Authenticode signatures on BOTH the downloaded installer
          # AND the installed app exe (VerifyAuthenticode in DoReading /
          # DoVerifying). Sign them BEFORE packaging so signed files ship
          # inside the setup.exe.
          if ("${{ secrets.SIGN_CERT_BASE64 }}" -eq "") {
            Write-Host "Warning: No signing certificate configured — app exe and update_agent.exe will be UNSIGNED" -ForegroundColor Yellow
            Write-Host "The update agent REJECTS unsigned binaries. Configure SIGN_CERT_BASE64 + SIGN_PASSWORD to enable self-update." -ForegroundColor Yellow
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Host "ERROR: signtool.exe not found" -ForegroundColor Red
            exit 1
          }
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGN_CERT_BASE64 }}")
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $password = "${{ secrets.SIGN_PASSWORD }}"
          $buildDir = "build\windows\x64\runner\Release"
          $appName = "${{ steps.detect.outputs.app_name }}"
          $agentExe = "${{ steps.agent.outputs.agent_path }}"
          $files = @("$buildDir\$appName.exe", $agentExe)
          try {
            foreach ($f in $files) {
              & $signtool sign /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 /f $certPath /p $password $f
              if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR: Failed to sign $f" -ForegroundColor Red
                exit 1
              }
              Write-Host "Signed: $f" -ForegroundColor Green
            }
            # Export the public certificate so setup.iss can install it into
            # each board's CurrentUser\Root trust store (the update agent
            # verifies signatures with WinVerifyTrust, which requires the
            # self-signed root to be trusted on the board).
            $certObj = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $password)
            $cerBytes = $certObj.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            [IO.File]::WriteAllBytes("$buildDir\intelliattend_signing.cer", $cerBytes)
            Write-Host "Exported intelliattend_signing.cer for trust-store install" -ForegroundColor Green
          } finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "ERROR: ISCC.exe not found after install" -ForegroundColor Red
            exit 1
          }
          Write-Host "Inno Setup found: $iscc" -ForegroundColor Green

      - name: Build Installer
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $appName = "${{ steps.detect.outputs.app_name }}"
          $buildDir = "build\windows\x64\runner\Release"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }

          & $iscc /DAppVersion="$version" /DSourceDir="$env:GITHUB_WORKSPACE\$buildDir" /DAgentDir="${{ steps.agent.outputs.agent_dir }}" "$env:GITHUB_WORKSPACE\windows\inno_setup\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Inno Setup compilation failed" -ForegroundColor Red
            exit 1
          }

          # Inno Setup outputs IntelliAttendSmartBoard-{version}-Setup.exe (PascalCase)
          $setupExe = "$buildDir\IntelliAttendSmartBoard-$version-Setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Host "ERROR: setup.exe not found at $setupExe" -ForegroundColor Red
            Get-ChildItem $buildDir -Filter "*Setup*" | ForEach-Object { Write-Host "  Found: $($_.Name)" }
            exit 1
          }

          # Sign the setup.exe if certificate is available
          if ("${{ secrets.SIGN_CERT_BASE64 }}" -ne "") {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              Write-Host "ERROR: signtool.exe not found" -ForegroundColor Red
              exit 1
            }
            $certBytes = [Convert]::FromBase64String("${{ secrets.SIGN_CERT_BASE64 }}")
            $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            $password = "${{ secrets.SIGN_PASSWORD }}"
            try {
              # RFC 3161 timestamping (/tr /td sha256) for durable signatures
              # that survive certificate expiry.
              & $signtool sign /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 /f $certPath /p $password "$setupExe"
              if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR: Failed to sign installer" -ForegroundColor Red
                exit 1
              }
              Write-Host "Installer signed successfully" -ForegroundColor Green
            } finally {
              if (Test-Path $certPath) { Remove-Item $certPath -Force }
            }
          } else {
            Write-Host "Warning: No signing certificate — installer is unsigned" -ForegroundColor Yellow
            Write-Host "NOTE: The C++ update agent REJECTS unsigned installers. Configure SIGN_CERT_BASE64 before relying on self-update." -ForegroundColor Yellow
          }

          $sha256 = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer: $setupExe"
          Write-Host "SHA-256: $sha256"

          Set-Content -Path "$buildDir\IntelliAttendSmartBoard-$version.sha256" -Value $sha256 -Encoding UTF8

          $sizeMB = [math]::Round((Get-Item $setupExe).Length / 1MB, 2)
          Write-Host "Installer size: $sizeMB MB" -ForegroundColor Green

          "setup_name=IntelliAttendSmartBoard-$version-Setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          # Fail the release if any shipped binary is unsigned/invalid — an
          # unsigned artifact would be rejected by the update agent on every
          # board and every board would retry in a loop.
          if ("${{ secrets.SIGN_CERT_BASE64 }}" -eq "") {
            Write-Host "SKIP: No signing certificate configured — skipping signature verification" -ForegroundColor Yellow
            exit 0
          }
          $buildDir = "build\windows\x64\runner\Release"
          $setupExe = Get-ChildItem $buildDir -Filter "*-Setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Host "ERROR: setup.exe not found" -ForegroundColor Red
            exit 1
          }
          # ---- Offline Authenticode verification ---------------------------
          # The previous version called Get-AuthenticodeSignature, whose
          # WinVerifyTrust revocation (CRL/OCSP) lookup blocked indefinitely on
          # GitHub Windows runners, hanging the job 30-60 min every run. This
          # version makes NO network calls: it extracts the embedded PKCS#7
          # from the PE certificate table, verifies the signature
          # cryptographically, and proves the signer chains to OUR signing root.
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGN_CERT_BASE64 }}")
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          try {
            $password = "${{ secrets.SIGN_PASSWORD }}"
            $certObj = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPath, $password)
          } finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

          function Get-Pkcs7Signature {
            param([byte[]]$Bytes, [int]$PeOffset)
            if ($Bytes.Length -lt ($PeOffset + 24)) { return $null }
            if ($Bytes[$PeOffset] -ne 0x50 -or $Bytes[$PeOffset+1] -ne 0x45 -or
                $Bytes[$PeOffset+2] -ne 0 -or $Bytes[$PeOffset+3] -ne 0) { return $null }
            $opt = $PeOffset + 4 + 20
            $magic = [BitConverter]::ToUInt16($Bytes, $opt)
            if ($magic -eq 0x20B) { $dd = $opt + 112 }
            elseif ($magic -eq 0x10B) { $dd = $opt + 96 }
            else { return $null }
            $certOff = [BitConverter]::ToUInt32($Bytes, $dd + 32)
            $certSize = [BitConverter]::ToUInt32($Bytes, $dd + 36)
            if ($certOff -eq 0 -or $certSize -eq 0) { return $null }
            $len = [BitConverter]::ToUInt32($Bytes, $certOff)
            if ($len -le 8 -or $len -gt $certSize) { return $null }
            $sigBytes = New-Object byte[] ($len - 8)
            [Array]::Copy($Bytes, $certOff + 8, $sigBytes, 0, $len - 8)
            return ,$sigBytes
          }

          Add-Type -AssemblyName System.Security.Cryptography.Pkcs
          $appName = "${{ steps.detect.outputs.app_name }}"
          $agentExe = "${{ steps.agent.outputs.agent_path }}"
          $files = @($setupExe.FullName, "$buildDir\$appName.exe", $agentExe)
          $failed = $false
          foreach ($f in $files) {
            $data = [IO.File]::ReadAllBytes($f)
            if ($data.Length -lt 0x40) {
              Write-Host "ERROR: $f is too small to be a PE image." -ForegroundColor Red
              $failed = $true
              continue
            }
            $peOff = [BitConverter]::ToInt32($data, 0x3C)
            $sigBytes = Get-Pkcs7Signature -Bytes $data -PeOffset $peOff
            if (-not $sigBytes) {
              Write-Host "ERROR: $f has no embedded Authenticode signature." -ForegroundColor Red
              $failed = $true
              continue
            }
            try {
              $cms = New-Object System.Security.Cryptography.Pkcs.SignedCms
              $cms.Decode($sigBytes)
              $cms.CheckSignature($true)
            } catch {
              Write-Host "ERROR: $f PKCS#7 verification failed: $($_.Exception.Message)" -ForegroundColor Red
              $failed = $true
              continue
            }
            $signer = $cms.SignerInfos[0].Certificate
            if (-not $signer) {
              Write-Host "ERROR: $f has no signer certificate." -ForegroundColor Red
              $failed = $true
              continue
            }
            if ($signer.Thumbprint -ne $certObj.Thumbprint) {
              Write-Host "ERROR: $f signer thumbprint $($signer.Thumbprint) does not match the signing cert." -ForegroundColor Red
              $failed = $true
              continue
            }
            $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
            $chain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
            $chain.ChainPolicy.VerificationFlags = [System.Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
            $chain.ChainPolicy.TrustMode = [System.Security.Cryptography.X509Certificates.X509ChainTrustMode]::CustomRootTrust
            $chain.ChainPolicy.CustomTrustStore.Add($certObj)
            if (-not $chain.Build($signer)) {
              $reason = ($chain.ChainStatus | ForEach-Object { $_.StatusInformation }) -join "; "
              Write-Host "ERROR: $f does not chain to the signing root: $reason" -ForegroundColor Red
              $failed = $true
              continue
            }
            Write-Host "  $f : signed by $($signer.Subject), chained to signing root (OK)" -ForegroundColor Green
          }
          if ($failed) { exit 1 }
          Write-Host "All release binaries Authenticode-signed and verified" -ForegroundColor Green

      - name: Create version manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $flutterVersion = "${{ steps.version.outputs.flutter_version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $sha256 = "${{ steps.installer.outputs.sha256 }}"
          $setupName = "${{ steps.installer.outputs.setup_name }}"

          $buildDir = "build\windows\x64\runner\Release"
          $exeTime = (Get-ChildItem "$buildDir\*.exe" | Select-Object -First 1).LastWriteTime

          $manifest = @{
            latest_version = $flutterVersion
            download_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
            sha256 = $sha256
            force = $true
            rollout_percentage = 100
            minimum_version = $flutterVersion
            build_timestamp = $exeTime.ToString("o")
            flutter_sdk = "3.44.6"
          }

          $manifest | ConvertTo-Json | Out-File -FilePath "build\windows\x64\runner\Release\latest.json" -Encoding UTF8
          Write-Host "Manifest created"

      - name: Generate build info and checksums (validation evidence)
        id: buildinfo
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildDir = "build\windows\x64\runner\Release"
          $agentExe = "${{ steps.agent.outputs.agent_path }}"

          $artifactFiles = @(
            (Join-Path $buildDir "IntelliAttendSmartBoard-$version-Setup.exe"),
            (Join-Path $buildDir "IntelliAttendSmartBoard-$version.sha256"),
            (Join-Path $buildDir "latest.json"),
            "$agentExe"
          )
          $cer = Join-Path $buildDir "intelliattend_signing.cer"
          if (Test-Path $cer) { $artifactFiles += $cer }

          $lines = foreach ($f in $artifactFiles) {
            if (Test-Path $f) {
              $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
              "$h *$([IO.Path]::GetFileName($f))"
            }
          }
          $lines | Set-Content -Path "SHA256SUMS" -Encoding UTF8

          $buildInfo = [ordered]@{
            build_version = "$version"
            flutter_version = "${{ steps.version.outputs.flutter_version }}"
            commit = "${{ github.sha }}"
            tag = "${{ steps.version.outputs.tag }}"
            run_id = "${{ github.run_id }}"
            promoted = "${{ inputs.promote }}"
            build_timestamp = (Get-Date).ToUniversalTime().ToString("o")
            flutter_sdk = "3.44.6"
          }
          $buildInfo | ConvertTo-Json | Set-Content -Path "build-info.json" -Encoding UTF8
          Get-Content SHA256SUMS
          Write-Host "build-info.json + SHA256SUMS written" -ForegroundColor Green

      - name: Upload build artifacts (validation evidence)
        uses: actions/upload-artifact@v4
        with:
          name: validation-candidate-${{ steps.version.outputs.version }}
          path: |
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json
            build\windows\x64\runner\Release\*.cer
            build\windows\x64\runner\Release\*.pdb
            build\windows\x64\update_agent\Release\update_agent.exe
            build\windows\x64\update_agent\Release\*.pdb
            SHA256SUMS
            build-info.json
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}

            Download `IntelliAttendSmartBoard-${{ steps.version.outputs.version }}-Setup.exe` and double-click to install.
          files: |
            build\windows\x64\runner\Release\*-Setup.exe
            build\windows\x64\runner\Release\*.sha256
            build\windows\x64\runner\Release\latest.json
            build\windows\x64\runner\Release\*.cer
            build\windows\x64\runner\Release\*.pdb
            build\windows\x64\update_agent\Release\update_agent.exe
            build\windows\x64\update_agent\Release\*.pdb
            SHA256SUMS
            build-info.json
          draft: false
          prerelease: false

      - name: Wait for server to be ready
        if: ${{ vars.SERVER_URL != '' }}
        shell: bash
        run: |
          SERVER_URL="${{ vars.SERVER_URL }}"
          echo "Waiting for server to be ready at ${SERVER_URL}..."
          
          MAX_ATTEMPTS=60
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVER_URL}/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready (attempt $i)"
              break
            fi
            echo "Waiting for server... (attempt $i/$MAX_ATTEMPTS, HTTP $HTTP_CODE)"
            sleep 5
          done
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Warning: Server may not be fully ready, proceeding with upload anyway"
          fi

      - name: Upload to server (fleet promotion — GATED)
        if: ${{ inputs.promote == 'true' && vars.SERVER_URL != '' }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FLUTTER_VERSION="${{ steps.version.outputs.flutter_version }}"
          SETUP_PATH="build/windows/x64/runner/Release/${{ steps.installer.outputs.setup_name }}"
          SERVER_URL="${{ vars.SERVER_URL }}"
          
          echo "Uploading v${FLUTTER_VERSION} (Setup: ${VERSION}) to ${SERVER_URL}..."
          
          MAX_RETRIES=10
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
              -X POST "${SERVER_URL}/api/v1/board/ci-upload" \
              -H "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
              -F "version=${VERSION}" \
              -F "flutter_version=${FLUTTER_VERSION}" \
              -F "release_notes=Auto-deploy from commit ${{ github.sha }}" \
              -F "commit_hash=${{ github.sha }}" \
              -F "force=true" \
              -F "rollout_percentage=100" \
              -F "file=@${SETUP_PATH}")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully uploaded v${FLUTTER_VERSION}"
              cat /tmp/upload_response.json
              exit 0
            fi
            
            RESPONSE=$(cat /tmp/upload_response.json 2>/dev/null || echo "No response body")
            echo "Attempt $i/$MAX_RETRIES failed (HTTP $HTTP_CODE): $RESPONSE"
            
            if [ "$HTTP_CODE" = "401" ]; then
              echo "ERROR: Invalid deploy key — check DEPLOY_KEY secret matches server"
              exit 1
            fi
            
            if [ "$HTTP_CODE" = "413" ]; then
              echo "ERROR: File too large — check server upload size limits"
              exit 1
            fi
            
            if [ "$HTTP_CODE" = "422" ]; then
              echo "ERROR: Invalid request parameters"
              exit 1
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "ERROR: Upload failed after $MAX_RETRIES attempts"
          exit 1
