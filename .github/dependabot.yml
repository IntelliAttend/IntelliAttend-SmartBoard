# Dependabot auto-update configuration
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Flutter / Dart dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      flutter-patch:
        applies-to: version-updates
        patterns:
          - "flutter*"
          - "dart*"
        update-types:
          - "patch"
          - "minor"

  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
