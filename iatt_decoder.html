<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IATT v7.0 Binary QR Validator (Live Cam)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #00f2ff; margin: 0; font-size: 20px; letter-spacing: 1px; }
        
        #video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #canvas { display: none; }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-region {
            width: 250px; height: 250px;
            border: 2px solid #00f2ff;
            border-radius: 20px;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.5);
            position: relative;
        }
        .scan-region::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #00f2ff; box-shadow: 0 0 15px #00f2ff;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .config-panel {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
        }
        input {
            padding: 10px; background: #000; border: 1px solid #444;
            color: #00f2ff; border-radius: 4px; font-family: monospace;
        }
        
        .result-panel {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #333;
            min-height: 150px;
        }
        .result-panel.valid { border-left-color: #00ff00; }
        .result-panel.invalid { border-left-color: #ff0000; }

        .field { margin-bottom: 12px; }
        .label { color: #888; font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-family: monospace; word-break: break-all; font-size: 14px; color: #fff; }
        .status-badge {
            padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold;
            display: inline-block; margin-top: 5px;
        }
        .status-valid { background: #004d00; color: #00ff00; }
        .status-invalid { background: #4d0000; color: #ff0000; }
        
        .placeholder {
            height: 100%; display: flex; align-items: center; justify-content: center;
            color: #444; font-style: italic; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>IATT PROTOCOL VALIDATOR</h1>
        <div id="cam-status" style="font-size: 10px; color: #666;">INITIALIZING CAMERA...</div>
    </div>

    <div class="config-panel">
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 10px; color: #888;">HMAC SESSION SECRET</label>
            <input type="text" id="secret" value="SUPER_HARDWARE_SECRET_999">
        </div>
        <div style="display: flex; align-items: flex-end;">
            <button onclick="toggleCamera()" id="cam-btn" style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">STOP CAMERA</button>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 8px;">
            <button onclick="pasteFromClipboard()" style="padding: 10px 20px; background: #1a4d1a; color: white; border: none; border-radius: 4px; cursor: pointer;">PASTE TOKEN</button>
        </div>
    </div>

    <div id="video-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="overlay">
            <div class="scan-region"></div>
            <div style="margin-top: 20px; color: #00f2ff; font-size: 12px; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,1);">ALIGN QR TO VALIDATE</div>
        </div>
    </div>

    <div id="result" class="result-panel">
        <div class="placeholder">Waiting for scan...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const resultPanel = document.getElementById('result');
    const camStatus = document.getElementById('cam-status');
    let stream = null;
    let scanning = true;

    async function hmacSha256(key, message) {
        const g = str => new TextEncoder().encode(str);
        const k = await crypto.subtle.importKey("raw", g(key), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        const s = await crypto.subtle.sign("HMAC", k, g(message));
        return Array.from(new Uint8Array(s)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function startCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            camStatus.innerText = "CAMERA ACTIVE";
            camStatus.style.color = "#00ff00";
            requestAnimationFrame(tick);
        } catch (err) {
            console.error(err);
            camStatus.innerText = "CAMERA ERROR: " + err.message;
            camStatus.style.color = "#ff0000";
        }
    }

    function toggleCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
            video.srcObject = null;
            document.getElementById('cam-btn').innerText = "START CAMERA";
            camStatus.innerText = "CAMERA STOPPED";
        } else {
            startCamera();
            document.getElementById('cam-btn').innerText = "STOP CAMERA";
        }
    }

    function base64UrlDecode(b64) {
        // Restore padding for URL-safe base64
        let s = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4 !== 0) s += '=';
        const binary = atob(s);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    function bytesToHex(bytes) {
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function hmacSha256Bytes(key, message) {
        const enc = new TextEncoder();
        const k = await crypto.subtle.importKey("raw", enc.encode(key), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        const s = await crypto.subtle.sign("HMAC", k, message);
        return new Uint8Array(s);
    }

    async function processPayload(payloadStr) {
        if (!payloadStr.startsWith('IATT::')) return;
        
        const secret = document.getElementById('secret').value.trim();
        const b64 = payloadStr.substring(6); // strip 'IATT::'

        try {
            const raw = base64UrlDecode(b64);
            if (raw.length !== 20) return;

            const sidHash = raw.slice(0, 6);
            const tsSec = (raw[6] << 24) | (raw[7] << 16) | (raw[8] << 8) | raw[9];
            const nonce = raw.slice(10, 12);
            const providedHmac = raw.slice(12, 20);

            // Reconstruct header: sidHash(6) + timestampBE(4) + nonce(2)
            const header = raw.slice(0, 12);

            const fullHmac = await hmacSha256Bytes(secret, header);
            const expectedHmac = fullHmac.slice(0, 8);
            const isValid = bytesToHex(expectedHmac) === bytesToHex(providedHmac);

            const nowSec = Math.floor(Date.now() / 1000);
            const ageSec = nowSec - tsSec;
            const ttlStatus = ageSec <= 300 ? '✓ FRESH' : '⚠ STALE (' + ageSec + 's)';

            const tsDate = new Date(tsSec * 1000);
            const timeStr = tsDate.toLocaleTimeString();
            const dateStr = tsDate.toLocaleDateString();

            resultPanel.className = 'result-panel ' + (isValid ? 'valid' : 'invalid');
            resultPanel.innerHTML = `
                <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                    <div class="field" style="flex: 1;">
                        <div class="label">v7.0 Binary QR</div>
                        <div class="status-badge ${isValid ? 'status-valid' : 'status-invalid'}">
                            HMAC: ${isValid ? 'VERIFIED ✓' : 'FORGED ✗'}
                        </div>
                    </div>
                    <div class="field" style="text-align: right;">
                        <div class="label">Age</div>
                        <div style="font-size: 12px; font-weight: bold; color: ${ageSec <= 300 ? '#00ff00' : '#ffaa00'}">${ttlStatus}</div>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                    <div class="field">
                        <div class="label">Session ID Hash (6 bytes)</div>
                        <div class="value">${bytesToHex(sidHash)}</div>
                    </div>
                    <div class="field">
                        <div class="label">Timestamp (UTC)</div>
                        <div class="value">${dateStr} ${timeStr}</div>
                    </div>
                    <div class="field">
                        <div class="label">Nonce (2 bytes)</div>
                        <div class="value">${bytesToHex(nonce)}</div>
                    </div>
                    <div class="field">
                        <div class="label">Payload Length</div>
                        <div class="value">${payloadStr.length} chars (v7.0)</div>
                    </div>
                </div>
            `;
        } catch (e) {
            console.error(e);
            resultPanel.innerHTML = `<div class="placeholder">Decode failed: ${e.message}</div>`;
        }
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.startsWith('IATT::')) {
                processPayload(text.trim());
            }
        } catch (e) {
            console.error('Clipboard read failed:', e);
        }
    }

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });
            if (code) {
                processPayload(code.data);
            }
        }
        if (stream) requestAnimationFrame(tick);
    }

    startCamera();
</script>

</body>
</html>
