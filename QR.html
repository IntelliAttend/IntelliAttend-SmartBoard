<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            justify-content: center;
        }
        .seat-tile {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
            user-select: none;
        }
        .seat-present {
            background: #f1f9e6; 
            color: #1a2e05; 
            border: 2px solid #84CC16;
        }
        .seat-empty {
            background: #F1F5F9;
            color: #94A3B8;
            border: 1.5px solid #E2E8F0;
        }
        .qr-gradient {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
        }
        .pulse-lime {
            animation: pulse-lime 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-lime {
            0%, 100% { opacity: 1; transform: scale(1); }

<script>
    (function() {
        const totalSeats = 70; // This can be changed to 50 or other values
        const presentSeats = [1, 2, 5, 8, 12, 13, 14, 15, 18, 20, 21, 22, 23, 25, 29, 31, 33, 34, 40, 42, 45, 48, 50, 51, 52, 55, 59, 60, 62, 65, 68, 70];
        const grid = document.currentScript.parentElement;
        
        for (let i = 1; i <= totalSeats; i++) {
            const isPresent = presentSeats.includes(i);
            const num = i.toString().padStart(2, '0');
            const stateClass = isPresent ? 'seat-present' : 'seat-empty';
            const tile = document.createElement('div');
            tile.className = `seat-tile ${stateClass} hover:scale-110 active:scale-95 cursor-default`;
            tile.textContent = num;
            grid.appendChild(tile);
        }
    })();
</script></div>
