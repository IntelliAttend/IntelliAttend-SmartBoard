<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lock Icon States — Interactive Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0f0f13;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    max-width: 1100px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    text-align: center;
    margin-bottom: 8px;
    color: #e2e8f0;
  }
  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 48px;
    font-weight: 400;
  }

  /* ── LOCK ICON ── */
  .lock-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 48px;
    padding: 48px 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .lock-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: default;
  }
  .stem {
    width: 2px;
    height: 40px;
    background: currentColor;
    opacity: 0.2;
  }
  .lock-ring-stack {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lock-ring-stack svg {
    position: absolute;
    width: 80px;
    height: 80px;
    transform: rotate(-90deg);
  }
  .lock-ring-stack svg .bg-ring {
    fill: none;
    stroke-width: 4;
  }
  .lock-ring-stack svg .fg-ring {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
  }
  .lock-icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    transition: background 0.3s ease, border-color 0.3s ease;
    border: 1.5px solid transparent;
  }
  .lock-icon-circle svg {
    width: 32px;
    height: 32px;
    transition: color 0.3s ease;
  }
  .lock-label {
    margin-top: 14px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.5;
    transition: color 0.3s ease;
    min-height: 32px;
    font-family: 'Inter', sans-serif;
  }

  /* ── SCENARIO GRID ── */
  .scenarios { margin-bottom: 36px; }
  .scenarios h2 {
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 1px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .scenario-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .scenario-btn {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.3px;
  }
  .scenario-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-1px);
  }
  .scenario-btn.active {
    border-color: currentColor;
    box-shadow: 0 0 20px currentColor;
  }
  .scenario-btn .badge {
    display: block;
    font-size: 10px;
    margin-top: 4px;
    opacity: 0.6;
    font-weight: 400;
  }
  .scenario-btn[data-color="teal"]   { --btn-color: #14b8a6; color: #14b8a6; }
  .scenario-btn[data-color="red"]    { --btn-color: #ef4444; color: #ef4444; }
  .scenario-btn[data-color="green"]  { --btn-color: #4ade80; color: #4ade80; }
  .scenario-btn[data-color="amber"]  { --btn-color: #f59e0b; color: #f59e0b; }
  .scenario-btn[data-color="grey"]   { --btn-color: #64748b; color: #64748b; }
  .scenario-btn.active {
    border-color: var(--btn-color);
    background: color-mix(in srgb, var(--btn-color) 12%, transparent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--btn-color) 25%, transparent);
  }

  /* ── CUSTOM TIMER ── */
  .custom-section {
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 24px 28px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .custom-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .custom-row label {
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
    min-width: 100px;
  }
  .custom-row input[type="range"] {
    flex: 1;
    min-width: 180px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
  }
  .custom-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #14b8a6;
    cursor: pointer;
    border: 2px solid #0f0f13;
    box-shadow: 0 0 8px rgba(20,184,166,0.4);
  }
  .custom-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #14b8a6;
    cursor: pointer;
    border: 2px solid #0f0f13;
  }
  .time-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #e2e8f0;
    min-width: 64px;
    text-align: right;
  }
  .custom-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .action-btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
    font-family: 'Inter', sans-serif;
  }
  .action-btn.primary {
    background: #14b8a6;
    color: #fff;
  }
  .action-btn.primary:hover { background: #0d9488; }
  .action-btn.outline {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.15);
    color: #94a3b8;
  }
  .action-btn.outline:hover {
    border-color: rgba(255,255,255,0.3);
    color: #e2e8f0;
  }
  .action-btn.danger {
    background: rgba(239,68,68,0.15);
    color: #ef4444;
  }
  .action-btn.danger:hover { background: rgba(239,68,68,0.25); }

  /* ── STATE INFO ── */
  .state-info {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #64748b;
  }
  .state-info .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .state-info strong { color: #94a3b8; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .scenario-grid { grid-template-columns: repeat(2, 1fr); }
    .custom-row { flex-direction: column; align-items: stretch; }
    .custom-row label { min-width: auto; }
    .time-display { text-align: center; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Lock Icon States</h1>
  <p class="subtitle">Interactive demo — click a scenario or use the custom slider</p>

  <!-- LOCK ICON -->
  <div class="lock-section">
    <div class="lock-wrapper" id="lockWrapper">
      <div class="stem" id="lockStem"></div>
      <div class="lock-ring-stack">
        <svg viewBox="0 0 80 80">
          <circle class="bg-ring" cx="40" cy="40" r="34" id="bgRing"/>
          <circle class="fg-ring" cx="40" cy="40" r="34" id="fgRing"
            stroke-dasharray="213.63" stroke-dashoffset="0"/>
        </svg>
        <div class="lock-icon-circle" id="lockCircle">
          <svg id="lockIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" id="lockShackle"/>
          </svg>
        </div>
      </div>
      <div class="lock-label" id="lockLabel">SESSION LOCKED</div>
    </div>
    <div class="state-info" id="stateInfo">
      <span class="dot" id="stateDot" style="background:#64748b"></span>
      <span>State: <strong id="stateName">locked</strong></span>
      <span style="opacity:0.3">|</span>
      <span>Ring: <strong id="ringValue">0%</strong></span>
    </div>
  </div>

  <!-- SCENARIOS -->
  <div class="scenarios">
    <h2>Scenarios</h2>
    <div class="scenario-grid">
      <button class="scenario-btn" data-color="red" data-scenario="cooldown" onclick="setScenario('cooldown')">
        Cooldown
        <span class="badge">120s · red ring</span>
      </button>
      <button class="scenario-btn" data-color="teal" data-scenario="bio" onclick="setScenario('bio')">
        Bio Break
        <span class="badge">10 min · teal ring</span>
      </button>
      <button class="scenario-btn" data-color="teal" data-scenario="lunch" onclick="setScenario('lunch')">
        Lunch Break
        <span class="badge">30 min · teal ring</span>
      </button>
      <button class="scenario-btn" data-color="green" data-scenario="t3" onclick="setScenario('t3')">
        T-3 Unlocked
        <span class="badge">green ring + open lock</span>
      </button>
      <button class="scenario-btn" data-color="green" data-scenario="warming" onclick="setScenario('warming')">
        Warming Up
        <span class="badge">green ring + locked</span>
      </button>
      <button class="scenario-btn" data-color="amber" data-scenario="completed" onclick="setScenario('completed')">
        Completed
        <span class="badge">amber checkmark</span>
      </button>
      <button class="scenario-btn" data-color="grey" data-scenario="locked" onclick="setScenario('locked')">
        Locked
        <span class="badge">no ring · grey icon</span>
      </button>
    </div>
  </div>

  <!-- CUSTOM -->
  <div class="custom-section">
    <div class="custom-row">
      <label for="timeSlider">⏱ Custom countdown</label>
      <input type="range" id="timeSlider" min="0" max="3600" value="600" step="1">
      <span class="time-display" id="timeDisplay">10:00</span>
    </div>
    <div class="custom-actions">
      <button class="action-btn primary" onclick="startCustom()">▶ Start Countdown</button>
      <button class="action-btn danger" onclick="resetLock()">■ Stop & Reset</button>
      <button class="action-btn outline" onclick="setCustomRing()">Apply as Static</button>
    </div>
  </div>
</div>

<script>
// ── Color Palette ──
const COLORS = {
  teal:     { hex: '#14b8a6', name: 'teal' },
  red:      { hex: '#ef4444', name: 'red' },
  green:    { hex: '#4ade80', name: 'green' },
  amber:    { hex: '#f59e0b', name: 'amber' },
  grey:     { hex: '#64748b', name: 'grey' },
  white:    { hex: '#ffffff', name: 'white' },
};

// ── DOM Refs ──
const fgRing    = document.getElementById('fgRing');
const bgRing    = document.getElementById('bgRing');
const lockCircle = document.getElementById('lockCircle');
const lockLabel  = document.getElementById('lockLabel');
const lockIcon   = document.getElementById('lockIcon');
const lockStem   = document.getElementById('lockStem');
const lockShackle = document.getElementById('lockShackle');
const stateDot   = document.getElementById('stateDot');
const stateName  = document.getElementById('stateName');
const ringValue  = document.getElementById('ringValue');
const timeSlider = document.getElementById('timeSlider');
const timeDisplay = document.getElementById('timeDisplay');

const CIRCUMFERENCE = 2 * Math.PI * 34; // ≈ 213.63

let countdownTimer = null;
let currentState = 'locked';
let progress = 0; // 0..1

// ── Helpers ──
function setRingProgress(p) {
  progress = Math.max(0, Math.min(1, p));
  const offset = CIRCUMFERENCE * (1 - progress);
  fgRing.setAttribute('stroke-dashoffset', offset);
  ringValue.textContent = Math.round(progress * 100) + '%';
}

function setColors(c) {
  const isDark = c.hex === '#64748b' || c.hex === '#0f0f13';
  fgRing.setAttribute('stroke', c.hex);
  bgRing.setAttribute('stroke', c.hex.replace(')', '').includes('rgba') ? c.hex : `${c.hex}1A`);
  bgRing.setAttribute('stroke', hexToRgba(c.hex, 0.1));
  lockCircle.style.background = hexToRgba(c.hex, 0.12);
  lockCircle.style.borderColor = c.hex === COLORS.grey.hex ? hexToRgba(c.hex, 0.15) : 'transparent';
  lockIcon.style.color = c.hex;
  lockLabel.style.color = c.hex;
  lockStem.style.color = c.hex;
  stateDot.style.background = c.hex;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function setIcon(type) {
  if (type === 'check') {
    lockIcon.innerHTML = `<circle cx="12" cy="12" r="10" stroke="currentColor" fill="none"/><path d="M8 12l2.5 2.5L16 9" stroke="currentColor" fill="none"/>`;
    lockShackle.style.display = 'none';
  } else if (type === 'unlocked') {
    lockIcon.innerHTML =
      `<rect x="5" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/><path d="M8 11V7a4 4 0 0 1 8 0v4" id="lockShackle"/>`;
    lockShackle.style.display = 'block';
    lockIcon.querySelector('path').style.display = 'block';
  } else {
    lockIcon.innerHTML =
      `<rect x="5" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/><path d="M8 11V7a4 4 0 0 1 8 0v4" id="lockShackle"/>`;
    lockShackle.style.display = 'block';
  }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── Slider ──
timeSlider.addEventListener('input', () => {
  const sec = parseInt(timeSlider.value);
  timeDisplay.textContent = formatTime(sec);
});

// ── Scenarios ──
function setScenario(name) {
  stopTimer();
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-scenario="${name}"]`);
  if (btn) btn.classList.add('active');

  switch (name) {
    case 'cooldown':
      currentState = 'cooldown';
      setColors(COLORS.red);
      setIcon('locked');
      lockLabel.textContent = 'COOLDOWN PHASE\n02:00';
      setRingProgress(1);
      startCountdown(120, () => {
        lockLabel.textContent = 'SESSION LOCKED';
        setRingProgress(0);
        setColors(COLORS.grey);
      });
      stateName.textContent = 'cooldown (120s)';
      break;

    case 'bio':
      currentState = 'bio';
      setColors(COLORS.teal);
      setIcon('locked');
      lockLabel.textContent = 'BIO BREAK\n10:00';
      setRingProgress(1);
      startCountdown(600, () => {
        lockLabel.textContent = 'SESSION LOCKED';
        setRingProgress(0);
        setColors(COLORS.grey);
      });
      stateName.textContent = 'bio break (10 min)';
      break;

    case 'lunch':
      currentState = 'lunch';
      setColors(COLORS.teal);
      setIcon('locked');
      lockLabel.textContent = 'LUNCH BREAK\n30:00';
      setRingProgress(1);
      startCountdown(1800, () => {
        lockLabel.textContent = 'SESSION LOCKED';
        setRingProgress(0);
        setColors(COLORS.grey);
      });
      stateName.textContent = 'lunch break (30 min)';
      break;

    case 't3':
      currentState = 't3';
      stopTimer();
      setColors(COLORS.green);
      setIcon('unlocked');
      lockLabel.textContent = 'TAP TO START';
      setRingProgress(1);
      stateName.textContent = 'T-3 unlocked (green ring)';
      break;

    case 'warming':
      currentState = 'warming';
      stopTimer();
      setColors(COLORS.green);
      setIcon('locked');
      lockLabel.textContent = 'WARMING UP...';
      setRingProgress(1);
      stateName.textContent = 'warming up (green ring, locked)';
      break;

    case 'completed':
      currentState = 'completed';
      stopTimer();
      setColors(COLORS.amber);
      setIcon('check');
      lockLabel.textContent = 'COMPLETED';
      setRingProgress(1);
      stateName.textContent = 'completed (amber)';
      break;

    case 'locked':
    default:
      currentState = 'locked';
      stopTimer();
      setColors(COLORS.grey);
      setIcon('locked');
      lockLabel.textContent = 'SESSION LOCKED';
      setRingProgress(0);
      stateName.textContent = 'locked (no ring)';
      break;
  }
}

// ── Countdown Timer ──
function startCountdown(totalSeconds, onComplete) {
  stopTimer();
  let remaining = totalSeconds;
  countdownTimer = setInterval(() => {
    remaining--;
    if (remaining < 0) {
      stopTimer();
      if (onComplete) onComplete();
      return;
    }
    // Update label
    const label = currentState === 'cooldown' ? 'COOLDOWN PHASE' :
                  currentState === 'bio' ? 'BIO BREAK' :
                  currentState === 'lunch' ? 'LUNCH BREAK' : '';
    if (label) {
      lockLabel.textContent = `${label}\n${formatTime(remaining)}`;
    }
    setRingProgress(remaining / totalSeconds);
  }, 1000);
}

function stopTimer() {
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

// ── Custom ──
function startCustom() {
  const total = parseInt(timeSlider.value);
  if (total <= 0) return;
  stopTimer();
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));

  currentState = 'custom';
  setColors(COLORS.teal);
  setIcon('locked');
  lockLabel.textContent = `CUSTOM\n${formatTime(total)}`;
  setRingProgress(1);

  let remaining = total;
  countdownTimer = setInterval(() => {
    remaining--;
    if (remaining < 0) {
      stopTimer();
      lockLabel.textContent = 'SESSION LOCKED';
      setRingProgress(0);
      setColors(COLORS.grey);
      stateName.textContent = 'expired';
      return;
    }
    lockLabel.textContent = `CUSTOM\n${formatTime(remaining)}`;
    setRingProgress(remaining / total);
  }, 1000);
  stateName.textContent = `custom (${formatTime(total)})`;
}

function setCustomRing() {
  const sec = parseInt(timeSlider.value);
  if (sec <= 0) {
    resetLock();
    return;
  }
  stopTimer();
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));

  currentState = 'custom-static';
  setColors(COLORS.teal);
  setIcon('locked');
  const p = sec / 3600;
  setRingProgress(p);
  lockLabel.textContent = `CUSTOM ${formatTime(sec)}\nring ${Math.round(p*100)}%`;
  stateName.textContent = `custom static (${formatTime(sec)})`;
}

function resetLock() {
  stopTimer();
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  currentState = 'locked';
  setColors(COLORS.grey);
  setIcon('locked');
  lockLabel.textContent = 'SESSION LOCKED';
  setRingProgress(0);
  stateName.textContent = 'locked (reset)';
}
</script>
</body>
</html>
