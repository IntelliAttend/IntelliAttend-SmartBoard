name: intelliattend_smartboard
description: Offline-resilient, TOTP-based attendance engine for university classrooms.
version: 3.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & UI
  provider: ^6.1.1
  google_fonts: ^6.1.0
  qr_flutter: ^4.1.0
  video_player: ^2.9.1
  
  # Networking
  dio: ^5.4.1
  
  # Core Logic & Cryptography
  crypto: ^3.0.3
  http: ^1.1.0
  uuid: ^4.3.3
  
  # Storage & Security
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Window Management
  window_manager: ^0.3.9
  screen_brightness: ^0.2.2+1
  
  # Notifications
  flutter_local_notifications: ^17.0.0

  # Windows Registry (for Startup)
  registry: ^0.0.2
  
  # Logging
  logger: ^2.0.2+1

  # Path & Files
  path_provider: ^2.1.2
  
  # Network & Device Telemetry
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  web_socket_channel: ^2.4.0
  firebase_auth: ^4.17.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/background.png
