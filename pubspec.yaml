name: intelliattend_smartboard
description: Offline-resilient, TOTP-based attendance engine for school classrooms.
version: 5.5.0+64

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.41.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & UI
  provider: ^6.1.1
  google_fonts: ^8.1.0
  video_player: ^2.9.1
  
  # Networking
  dio: ^5.4.1
  
  # Core Logic & Cryptography
  crypto: ^3.0.3
  http: ^1.1.0
  uuid: ^4.3.3
  
  # Storage & Security
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_secure_storage: ^10.1.0
  shared_preferences: ^2.2.2
  
  # Firebase Auth uses FirebaseRestAuth (Identity Toolkit + Secure Token API
  # over HTTPS) — no Flutter Firebase plugins are needed on-device.

  # Environment Variables
  flutter_dotenv: ^6.0.1
  
  # Window Management
  window_manager: ^0.5.1
  # screen_brightness removed: unsupported on Windows desktop monitors
  # (the plugin probes WMI on every app launch and floods logs with
  # "Problem getting monitor brightness"). Brightness control is not a
  # requirement for the kiosk; QR codes are rendered at full intensity
  # by their widget regardless of OS brightness.
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.1

  # Windows Registry (for Startup)
  win32_registry: ^2.1.0
  
  # Logging
  logger: ^2.0.2+1

  # Observability (crash reporting + performance monitoring)
  sentry: ^8.14.2

  # Audio
  audioplayers: ^6.4.0

  # Path & Files
  path_provider: ^2.1.2
  
  # PDF Viewing
  pdfrx: ^2.4.3
  
  # Network & Device Telemetry
  connectivity_plus: ^7.1.1
  package_info_plus: ^9.0.1
  web_socket_channel: ^3.0.3
  number_flow: ^1.0.4
  # firebase_auth deliberately NOT included — the Windows C++ plugin calls
  # abort() when AuthStateListener / IdTokenListener callbacks fire on a
  # worker thread. Replaced by lib/core/security/firebase_rest_auth.dart
  # (Identity Toolkit + Secure Token API over HTTPS).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/background.png
    - assets/logo.png
    - assets/logo_square.png


dependency_overrides:
  flutter_secure_storage_windows:
    path: local_plugins/flutter_secure_storage_windows
  flutter_local_notifications_windows:
    path: local_plugins/flutter_local_notifications_windows
